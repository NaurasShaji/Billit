name: Apply SQLite migration patch

on:
  push:
    branches:
      - feature/sqlite-migration
    paths:
      - .github/workflows/apply-sqlite-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sqlite-migration-branch
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/sqlite-migration
          fetch-depth: 0

      - name: Verify patch payload
        run: |
          test -s billit-sqlite-migration.patch
          git status --short
          git --version

      - name: Check and apply patch
        run: |
          git apply --check --verbose billit-sqlite-migration.patch
          git apply --index --verbose billit-sqlite-migration.patch

      - name: Commit migration
        run: |
          if git diff --cached --quiet; then
            echo "Patch produced no changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate local storage from Hive to SQLite"
          git push origin HEAD:feature/sqlite-migration
