name: Apply SQLite migration patch

on:
  push:
    branches:
      - feature/sqlite-migration
    paths:
      - .github/workflows/apply-sqlite-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/sqlite-migration
          fetch-depth: 1

      - name: Check patch exists
        run: |
          test -f billit-sqlite-migration.patch || {
            echo "::error::Expected billit-sqlite-migration.patch in the repository root."
            exit 1
          }

      - name: Check and apply patch
        run: |
          git apply --check billit-sqlite-migration.patch
          git apply --index billit-sqlite-migration.patch

      - name: Remove patch payload
        run: rm billit-sqlite-migration.patch

      - name: Commit migration
        run: |
          if git diff --cached --quiet; then
            echo "Patch produced no changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Migrate local storage from Hive to SQLite"
          git push origin HEAD:feature/sqlite-migration
